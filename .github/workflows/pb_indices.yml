name: pb_indices

# دریافت شاخص‌های PPI یوروستات برای بانک قیمت (دسترسی مستقیم از محیط Claude بسته است).
# نتیجه در شاخه‌ی ci-pb-indices: eurostat_ppi.json و summary.txt
on:
  push:
    branches: [main]
    paths:
      - 'price_bank/tool/fetch_eurostat.py'
      - '.github/workflows/pb_indices.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Eurostat sts_inppd_a
        run: python3 price_bank/tool/fetch_eurostat.py /tmp/res
      - name: Publish
        if: always()
        run: |
          cd /tmp/res && echo "${GITHUB_SHA}" > commit.txt
          git init -q && git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "Eurostat PPI ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-pb-indices
