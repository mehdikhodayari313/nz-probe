name: pb_fx

# دریافت تاریخچه نرخ ارز ایران (آزاد/نیمایی/سنا) از tgju برای بانک قیمت. نتیجه در شاخه‌ی ci-pb-fx
on:
  push:
    branches: [main]
    paths:
      - 'price_bank/tool/fetch_fx_iran.py'
      - '.github/workflows/pb_fx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tgju
        run: python3 price_bank/tool/fetch_fx_iran.py /tmp/res
      - name: Publish
        if: always()
        run: |
          mkdir -p /tmp/res && cd /tmp/res && echo "${GITHUB_SHA}" > commit.txt
          git init -q && git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "FX Iran ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-pb-fx
