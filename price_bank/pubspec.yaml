name: price_bank
description: بانک قیمت تجهیزات واحدهای نمک‌زدایی
publish_to: 'none'
version: 0.9.9+18

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^3.6.1
  xml: ^6.5.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  file_picker: '>=8.1.2 <11.0.0'
  shamsi_date: ^1.1.1
  flex_color_scheme: ^8.4.0
  fl_chart: ^1.3.0
  flutter_animate: ^4.5.2
  animations: ^2.2.0
  data_table_2: ^2.8.0
  lucide_icons_flutter: ^4.0.1
  lottie: ^3.3.0
  rive: ^0.14.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
